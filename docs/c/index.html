<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Catálogo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛍️</text></svg>" />
<style>
  :root {
    --bg: #fff0f5;
    --fg: #3a0a1e;
    --accent: #e8437a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
    position: relative;
  }
  /* Fondo con gradiente: varios brillos del color de acento (esquinas + abajo)
     que dan profundidad sin tapar el contenido. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42vw 30vh at 6% -6%, var(--accent), transparent 60%),
      radial-gradient(48vw 34vh at 96% 0%, var(--accent), transparent 62%),
      radial-gradient(64vw 44vh at 50% 112%, var(--accent), transparent 60%);
    opacity: .15;
  }

  /* Estados (vacío / expirado) */
  .state {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 2rem; gap: .6rem;
  }
  .state__icon { font-size: 3rem; }
  .state__title { font-size: 1.3rem; font-weight: 700; }
  .state__msg { opacity: .75; max-width: 22rem; }

  /* Skeletons (carga) */
  .sk { position: relative; overflow: hidden; background: rgba(0,0,0,.07); border-radius: 8px; }
  .sk::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .sk-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .sk-card__img { aspect-ratio: 1/1; border-radius: 0; }
  .sk-card__body { padding: .7rem .8rem .9rem; display: flex; flex-direction: column; gap: .45rem; }
  .sk-line { height: 11px; border-radius: 6px; }

  /* Portada */
  .wrap { max-width: 1040px; margin: 0 auto; }
  header.cat {
    text-align: center;
    padding: 3rem 1.2rem 1.6rem;
  }
  .cat__logo {
    width: 96px; height: 96px; object-fit: cover; border-radius: 50%;
    margin: 0 auto 1.1rem; display: block; background: #fff;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18),
                0 0 0 2px var(--accent),
                0 0 0 6px rgba(255,255,255,.5);
  }
  .cat__title {
    font-size: clamp(1.8rem, 6.4vw, 2.8rem);
    font-weight: 800; letter-spacing: -.025em; line-height: 1.08;
  }
  .cat__subtitle {
    margin-top: .6rem; font-size: clamp(.95rem, 3.6vw, 1.12rem);
    opacity: .82; font-weight: 500; max-width: 34rem; margin-left: auto; margin-right: auto;
  }
  .cat__rule {
    width: 64px; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 1.3rem auto 0;
  }

  /* Secciones por colección. Ancho centrado en desktop según las columnas
     (~14rem por columna → 4 col ≈ 56rem = max-w-4xl). En móvil ocupa todo. */
  .section { padding: .6rem 1rem 0; max-width: min(94vw, calc(var(--cols, 4) * 14rem)); margin: 0 auto; }
  .section__title {
    display: flex; align-items: center; gap: .65rem;
    font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 800;
    padding: 1.6rem .2rem 1rem; letter-spacing: -.01em;
  }
  .section__title::before {
    content: ""; width: 14px; height: 22px; border-radius: 6px; flex: none;
    background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 55%, #000 0%));
    background: var(--accent);
  }
  /* Cantidad de productos en la sección (chip suave al lado del título). */
  .section__count {
    font-size: .72rem; font-weight: 700; letter-spacing: .02em;
    padding: .2rem .55rem; border-radius: 999px;
    background: var(--accent); color: #fff; opacity: .85;
  }
  /* Línea fina que se extiende a la derecha del título. */
  .section__title::after {
    content: ""; flex: 1; height: 2px; border-radius: 2px;
    background: var(--accent); opacity: .16;
  }
  .section:first-of-type .section__title { padding-top: .6rem; }

  /* Grilla de productos */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 2), 1fr);
    gap: 1rem;
    padding: 0 1rem;
  }
  /* Grilla suelta (sin separar por colección): mismo tope de ancho. */
  .grid--solo { max-width: min(94vw, calc(var(--cols, 4) * 14rem)); margin: 0 auto; }
  /* En pantallas chicas nunca más de 2; respeta --cols solo desde tablet. */
  @media (max-width: 539px) {
    .grid { grid-template-columns: repeat(min(var(--cols, 2), 3), 1fr); gap: .8rem; }
    /* En móvil achicamos los textos (sobre todo los nombres de categoría). */
    .cat__title { font-size: clamp(1.5rem, 7.4vw, 2rem); }
    .cat__subtitle { font-size: .88rem; }
    .section__title { font-size: .95rem; gap: .5rem; padding: 1.3rem .15rem .75rem; }
    .section__title::before { width: 11px; height: 17px; }
    .section__count { font-size: .6rem; padding: .14rem .45rem; }
    .card__name { font-size: .8rem; }
    .card__price { font-size: .86rem; padding: .2rem .55rem; }
  }
  @media (min-width: 540px) and (max-width: 860px) { .grid { grid-template-columns: repeat(min(var(--cols, 3), 3), 1fr); gap: 1rem; } }

  .card {
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,.09);
    display: flex; flex-direction: column; cursor: pointer;
    transition: transform .22s ease, box-shadow .22s ease;
    animation: cardIn .5s cubic-bezier(.2,.7,.25,1) both;
    animation-delay: calc(var(--i, 0) * 45ms);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (hover: hover) {
    .card:hover { transform: translateY(-5px); box-shadow: 0 16px 34px rgba(0,0,0,.16); }
    .card:hover .card__img { transform: scale(1.06); }
  }
  .card__imgwrap { position: relative; width: 100%; aspect-ratio: 1/1; background: #f3f3f3; overflow: hidden; }
  .card__img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .card__noimg {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; gap: .25rem;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.04); color: rgba(0,0,0,.3);
  }
  .card__noimg svg { width: 30px; height: 30px; }
  .card__noimg span { font-size: .62rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .card__body { padding: .75rem .85rem .95rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
  .card__brand { font-size: .66rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); opacity: .85; line-height: 1.2; }
  .card__name { font-size: .92rem; font-weight: 600; color: #232323; line-height: 1.3; }
  .card__price {
    margin-top: auto; align-self: flex-start;
    font-size: .98rem; font-weight: 800; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, #fff);
    padding: .22rem .6rem; border-radius: 999px; line-height: 1.2;
  }
  /* Respaldo si el navegador no soporta color-mix: queda sin fondo, solo color. */
  @supports not (color: color-mix(in srgb, red, blue)) {
    .card__price { background: transparent; padding: 0; font-size: 1.04rem; }
  }

  footer.cat { text-align: center; padding: 2.4rem 1rem 6rem; font-size: .82rem; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  /* Modal de producto (al tocar una tarjeta se ve el producto completo) */
  .pmodal { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .pmodal[hidden] { display: none; }
  .pmodal__backdrop {
    position: absolute; inset: 0; background: rgba(20,6,14,.62);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: pmFade .22s ease;
  }
  @keyframes pmFade { from { opacity: 0; } to { opacity: 1; } }
  .pmodal__panel {
    position: relative; z-index: 1; background: #fff; border-radius: 22px; overflow: hidden;
    width: 100%; max-width: 420px; max-height: 92dvh; display: flex; flex-direction: column;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.5);
    animation: pmIn .3s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes pmIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
  .pmodal__close {
    position: absolute; top: .7rem; right: .7rem; z-index: 2; width: 40px; height: 40px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.95); color: #c01f6b;
    font-size: 1.5rem; line-height: 1; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.22);
    -webkit-tap-highlight-color: transparent;
  }
  .pmodal__imgwrap { width: 100%; aspect-ratio: 1/1; background: #f4eef1; display: grid; place-items: center; overflow: hidden; }
  .pmodal__imgwrap img { width: 100%; height: 100%; object-fit: contain; }
  .pmodal__info { padding: 1.1rem 1.25rem 1.35rem; display: flex; flex-direction: column; gap: .7rem; }
  .pmodal__brand { font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); opacity: .85; }
  .pmodal__name { font-size: 1.18rem; font-weight: 800; line-height: 1.25; color: #232323; }
  .pmodal__price {
    align-self: flex-start; font-size: 1.12rem; font-weight: 800; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, #fff); padding: .32rem .75rem; border-radius: 999px;
  }
  @supports not (color: color-mix(in srgb, red, blue)) { .pmodal__price { background: transparent; padding: 0; } }
  .pmodal__wa {
    margin-top: .2rem; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    background: #25d366; color: #fff; text-decoration: none; font-weight: 700; font-size: 1rem;
    padding: .85rem; border-radius: 13px; box-shadow: 0 8px 22px rgba(37,211,102,.4);
  }
  .pmodal__wa svg { width: 20px; height: 20px; }
  /* Botón "Compartir con foto" (usa el compartir nativo del celular) */
  .pmodal__share {
    display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    background: #fff; color: var(--accent); border: 1.5px solid var(--accent);
    font-family: inherit; font-weight: 700; font-size: .98rem; cursor: pointer;
    padding: .8rem; border-radius: 13px; -webkit-tap-highlight-color: transparent;
  }
  .pmodal__share:disabled { opacity: .6; cursor: default; }
  .pmodal__share svg { width: 20px; height: 20px; }

  /* Botón flotante de WhatsApp */
  .wa-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    display: inline-flex; align-items: center; gap: .5rem;
    background: #25d366; color: #fff; text-decoration: none;
    padding: .8rem 1.1rem; border-radius: 999px; font-weight: 700; font-size: .95rem;
    box-shadow: 0 8px 26px rgba(37,211,102,.45);
  }
  .wa-fab svg { width: 22px; height: 22px; }
  .wa-fab__txt { white-space: nowrap; }
  @media (max-width: 480px) { .wa-fab__txt { display: none; } .wa-fab { padding: .85rem; } }

  /* Decoración de fondo: orbes de color difuminados (dan profundidad y
     movimiento) + unos pocos destellos delicados. Todo detrás del contenido. */
  .deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: var(--accent); }
  .deco .orb {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--accent), transparent 70%);
    opacity: .16; filter: blur(8px); will-change: transform;
    animation: drift var(--d, 16s) ease-in-out infinite;
  }
  .deco .star { position: absolute; opacity: .14; will-change: transform, opacity;
    animation: twinkle var(--d, 6s) ease-in-out infinite, floaty calc(var(--d, 6s) * 1.7) ease-in-out infinite; }
  .deco .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(0, -26px) scale(1.07); } }
  @keyframes twinkle { 0%, 100% { opacity: .08; transform: scale(.7); } 50% { opacity: .4; transform: scale(1); } }
  @keyframes floaty { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }
  @media (prefers-reduced-motion: reduce) { .deco .orb, .deco .star { animation: none; } }
  .wrap { position: relative; z-index: 1; }

  /* ── Impresión / Guardar como PDF ─────────────────────────
     Se ocultan decoraciones y botones; se conservan los colores de marca
     (fondo y acento) y se evita cortar una tarjeta entre dos páginas. */
  @media print {
    body::before, .deco, .wa-fab, .cat__actions, footer.cat { display: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    @page { margin: 10mm; }
    body { background: var(--bg) !important; }
    .card { animation: none !important; box-shadow: none !important;
            border: 1px solid rgba(0,0,0,.14); break-inside: avoid; }
    .section, .grid--solo { max-width: none !important; }
    .section__title { break-after: avoid; }
    /* Layout de PDF consistente en cualquier navegador: 3 por fila. */
    .grid { grid-template-columns: repeat(3, 1fr) !important; gap: 5mm !important; padding: 0 !important; }
    /* Portada compacta: si no, empuja la 2ª fila a la página siguiente y deja
       un hueco grande (solo cabía 1 fila). Compactándola caben ~2 filas en la
       primera página y ~3 en las siguientes. */
    header.cat { padding: 0 1rem .45rem !important; }
    .cat__logo { width: 44px !important; height: 44px !important; margin: 0 auto .35rem !important;
                 box-shadow: 0 0 0 2px var(--accent) !important; padding: 2px !important; }
    .cat__title { font-size: 17pt !important; line-height: 1.05 !important; }
    .cat__subtitle { font-size: 9pt !important; margin-top: .15rem !important; }
    .cat__rule { margin-top: .4rem !important; }
    .section__title { font-size: 11.5pt !important; padding: .45rem .2rem .4rem !important; }
    .section:first-of-type .section__title { padding-top: .15rem !important; }
    /* Tarjetas más compactas para que entren más filas por página. */
    .card__body { padding: .3rem .5rem .4rem !important; gap: .15rem !important; }
    .card__brand { font-size: 7pt !important; }
    .card__name { font-size: 8pt !important; line-height: 1.18 !important; }
    .card__price { font-size: 8pt !important; padding: .08rem .4rem !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

<script>
const API = 'https://api.pinkpowerhn.com';
let _cat = null;   // catálogo cargado (para abrir el modal de cada producto)
// Modo "solo PDF" (viene de Mis pedidos): la página solo sirve para descargar el
// PDF. No mostramos el botón de WhatsApp ni abrimos productos, y al terminar de
// imprimir dejamos una pantalla limpia (nada de catálogo interactivo con links).
let PDF_LOCAL = false;

function getToken() {
  const q = new URLSearchParams(location.search).get('c');
  if (q) return q.trim();
  return (location.hash || '').replace(/^#/, '').trim();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const NOIMG = `<div class="card__noimg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Sin foto</span></div>`;

// Capa de destellos flotando (decorativa). Posiciones fijas y variadas.
function decoHTML() {
  const estrella = `<svg viewBox="0 0 24 24"><path d="M12 0c.9 6.2 4.9 10.2 12 12-7.1 1.8-11.1 5.8-12 12-.9-6.2-4.9-10.2-12-12 7.1-1.8 11.1-5.8 12-12z"/></svg>`;
  // Orbes suaves (manchas de color difuminadas) que flotan lento.
  const orbsPos = [
    [-6, -8, 280, 17], [84, 2, 320, 20], [-8, 64, 300, 15],
    [90, 72, 300, 22], [42, 38, 220, 24], [22, 88, 240, 19],
  ];
  const orbs = orbsPos.map(([left, top, size, d], i) => `
    <span class="orb" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;--d:${d}s;animation-delay:-${(i * 1.6).toFixed(1)}s"></span>`).join('');
  // Destellos delicados (pocos y sutiles, para que no compitan con los orbes).
  const pts = [
    [9, 12, 16, 6.5], [16, 84, 12, 7.5], [30, 22, 11, 5.5],
    [62, 8, 13, 6], [70, 88, 15, 7], [82, 30, 11, 5.5],
    [40, 64, 12, 7], [88, 58, 13, 7.2],
  ];
  const stars = pts.map(([top, left, size, d], i) => `
    <span class="star" style="top:${top}%;left:${left}%;width:${size}px;height:${size}px;--d:${d}s;animation-delay:-${(i * 0.8).toFixed(1)}s">${estrella}</span>`).join('');
  return `<div class="deco" aria-hidden="true">${orbs}${stars}</div>`;
}

function stateView(icon, title, msg) {
  return `<div class="state">
    <div class="state__icon">${icon}</div>
    <div class="state__title">${esc(title)}</div>
    <p class="state__msg">${esc(msg)}</p>
  </div>`;
}

function skeletonView() {
  const cards = Array.from({ length: 8 }).map(() => `
    <div class="sk-card"><div class="sk sk-card__img"></div>
      <div class="sk-card__body"><div class="sk sk-line" style="width:85%"></div>
        <div class="sk sk-line" style="width:50%"></div></div></div>`).join('');
  return `<div class="wrap">
    <header class="cat">
      <div class="sk sk-line" style="height:26px;width:60%;max-width:280px;margin:.4rem auto"></div>
      <div class="sk sk-line" style="height:13px;width:40%;max-width:200px;margin:.6rem auto"></div>
    </header>
    <main class="grid" style="--cols:2">${cards}</main></div>`;
}

function cardHTML(it, i = 0, dataI = 0) {
  const img = it.imagen
    ? `<img class="card__img" src="${esc(it.imagen)}" alt="${esc(it.nombre)}" loading="lazy" />`
    : NOIMG;
  const precio = it.precio ? `<div class="card__price">${esc(it.precio)}</div>` : '';
  const marca = it.marca ? `<div class="card__brand">${esc(it.marca)}</div>` : '';
  return `<article class="card" style="--i:${i % 12}" data-i="${dataI}" role="button" tabindex="0">
    <div class="card__imgwrap">${img}</div>
    <div class="card__body">
      ${marca}
      <div class="card__name">${esc(it.nombre)}</div>
      ${precio}
    </div>
  </article>`;
}

// Ícono de WhatsApp (para el botón del modal)
const WA_ICON = `<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.5 6 1.5 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.8c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.3 1.4 1.4-4.2-.3-.4a10 10 0 0 1-1.6-5.6C5.6 9.7 10.3 5 16 5s10.4 4.7 10.4 10.5S21.7 25.8 16 25.8zm5.7-7.8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6.1c-1.7-.9-2.9-1.6-4-3.6-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-1 1-1.3 2.3-.9 3.7.6 1.9 1.8 3.5 2 3.8.3.3 3.5 5.3 8.4 7 .8.2 1.5.4 2 .5.8.1 1.6.1 2.2.1.7-.1 2.1-.8 2.4-1.7.3-.8.3-1.6.2-1.7-.1-.2-.3-.3-.6-.4z"/></svg>`;

// Ícono de "compartir" (para el botón de compartir con foto)
const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>`;

// Modal: muestra el producto completo (foto grande sin recorte, nombre, precio
// y botón para pedirlo por WhatsApp si la vendedora puso su número).
function openProductModal(it) {
  if (!it) return;
  let m = document.getElementById('pmodal');
  if (!m) { m = document.createElement('div'); m.id = 'pmodal'; m.className = 'pmodal'; document.body.appendChild(m); }

  const wa = _cat && _cat.opciones && _cat.opciones.whatsapp;
  const img = it.imagen ? `<img src="${esc(it.imagen)}" alt="${esc(it.nombre)}" />` : NOIMG;
  const marca = it.marca ? `<div class="pmodal__brand">${esc(it.marca)}</div>` : '';
  const precio = it.precio ? `<div class="pmodal__price">${esc(it.precio)}</div>` : '';
  const waText = encodeURIComponent(`Hola! Me interesa este producto: ${it.nombre}`);
  const waBtn = wa
    ? `<a class="pmodal__wa" href="https://wa.me/${esc(wa)}?text=${waText}" target="_blank" rel="noopener">${WA_ICON} Pedir por WhatsApp</a>`
    : '';
  // "Compartir con foto": usa la función de compartir del celular para mandar la
  // FOTO + el texto (los links de WhatsApp solo permiten texto). Solo se muestra
  // si el navegador soporta compartir y el producto tiene imagen.
  const puedeCompartir = !!(it.imagen && navigator.share);
  const shareBtn = puedeCompartir
    ? `<button type="button" class="pmodal__share" id="pmodal-share">${SHARE_ICON} Compartir con foto</button>`
    : '';

  m.innerHTML = `
    <div class="pmodal__backdrop" data-close></div>
    <div class="pmodal__panel">
      <button class="pmodal__close" data-close aria-label="Cerrar">&times;</button>
      <div class="pmodal__imgwrap">${img}</div>
      <div class="pmodal__info">
        ${marca}
        <div class="pmodal__name">${esc(it.nombre)}</div>
        ${precio}
        ${waBtn}
        ${shareBtn}
      </div>
    </div>`;
  m.hidden = false;
  document.body.style.overflow = 'hidden';

  const close = () => {
    m.hidden = true; document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
  };
  function onKey(e) { if (e.key === 'Escape') close(); }
  m.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
  const sb = m.querySelector('#pmodal-share');
  if (sb) sb.addEventListener('click', () => compartirConFoto(it, sb));
  document.addEventListener('keydown', onKey);
}

// Comparte la FOTO + texto del producto con la hoja de compartir del celular.
// Los links de WhatsApp solo mandan texto; esto sí manda la imagen. La clienta
// elige a qué chat/app enviarlo.
async function compartirConFoto(it, btn) {
  const texto = it.precio ? `${it.nombre} — ${it.precio}` : it.nombre;
  const original = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = `${SHARE_ICON} Preparando…`; }
  try {
    const resp = await fetch(it.imagen, { mode: 'cors' });
    const blob = await resp.blob();
    const file = new File([blob], 'producto.jpg', { type: blob.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: texto });
    } else {
      // El navegador no puede compartir archivos: mandamos texto + link de la foto
      // (WhatsApp muestra una vista previa con la imagen).
      await navigator.share({ text: `${texto}\n${it.imagen}` });
    }
  } catch (err) {
    // El usuario canceló (AbortError) o falló la descarga de la imagen: sin ruido.
    if (!(err && err.name === 'AbortError')) {
      try { await navigator.share({ text: `${texto}\n${it.imagen}` }); } catch (_) {}
    }
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = original; }
  }
}

// Agrupa items por colección preservando el orden de aparición. El grupo de
// productos sin colección se manda SIEMPRE al final (como "Otros productos"),
// para que no queden sueltos arriba de todo.
function agrupar(items) {
  const grupos = [];
  const idx = new Map();
  items.forEach(it => {
    const key = it.coleccion || '__sin__';
    if (!idx.has(key)) { idx.set(key, grupos.length); grupos.push({ key, titulo: it.coleccion || '', items: [] }); }
    grupos[idx.get(key)].items.push(it);
  });
  // Mover el grupo sin colección al final.
  const i = grupos.findIndex(g => g.key === '__sin__');
  if (i !== -1 && i !== grupos.length - 1) grupos.push(grupos.splice(i, 1)[0]);
  return grupos;
}

function render(cat) {
  _cat = cat;
  if (cat.colorFondo) document.documentElement.style.setProperty('--bg', cat.colorFondo);
  if (cat.colorTexto) document.documentElement.style.setProperty('--fg', cat.colorTexto);
  const op = cat.opciones || {};
  const accent = op.colorAcento || cat.colorTexto || '#e8437a';
  document.documentElement.style.setProperty('--accent', accent);
  const cols = [2, 3, 4].includes(op.columnas) ? op.columnas : 4;

  const titulo = cat.titulo || 'Catálogo';
  document.title = titulo;

  const items = Array.isArray(cat.items) ? cat.items : [];
  const separar = op.separarPorColeccion !== false && items.some(i => i.coleccion);
  // Orden alfabético por nombre (dentro de cada sección o en la grilla suelta).
  // El data-i para el modal se calcula contra el arreglo original (items.indexOf).
  const porNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' });

  let cuerpo;
  if (!items.length) {
    cuerpo = stateView('📭', 'Catálogo vacío', 'Este catálogo no tiene productos.');
  } else if (separar) {
    cuerpo = agrupar(items).map(g => {
      const titulo = g.titulo || 'Otros productos';
      const its = g.items.slice().sort(porNombre);
      return `
      <section class="section" style="--cols:${cols}">
        <h2 class="section__title">${esc(titulo)}<span class="section__count">${its.length}</span></h2>
        <div class="grid">${its.map((it, j) => cardHTML(it, j, items.indexOf(it))).join('')}</div>
      </section>`;
    }).join('');
  } else {
    const sorted = items.slice().sort(porNombre);
    cuerpo = `<main class="grid grid--solo" style="--cols:${cols}">${sorted.map((it, j) => cardHTML(it, j, items.indexOf(it))).join('')}</main>`;
  }

  const logo = op.logo ? `<img class="cat__logo" src="${esc(op.logo)}" alt="" />` : '';
  const wa = (op.whatsapp && !PDF_LOCAL) ? `
    <a class="wa-fab" href="https://wa.me/${esc(op.whatsapp)}?text=${encodeURIComponent('Hola! Vi tu catálogo y quiero hacer un pedido 🛍️')}" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.5 6 1.5 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.8c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.3 1.4 1.4-4.2-.3-.4a10 10 0 0 1-1.6-5.6C5.6 9.7 10.3 5 16 5s10.4 4.7 10.4 10.5S21.7 25.8 16 25.8zm5.7-7.8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6.1c-1.7-.9-2.9-1.6-4-3.6-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-1 1-1.3 2.3-.9 3.7.6 1.9 1.8 3.5 2 3.8.3.3 3.5 5.3 8.4 7 .8.2 1.5.4 2 .5.8.1 1.6.1 2.2.1.7-.1 2.1-.8 2.4-1.7.3-.8.3-1.6.2-1.7-.1-.2-.3-.3-.6-.4z"/></svg>
      <span class="wa-fab__txt">Hacer pedido</span>
    </a>` : '';

  document.getElementById('root').innerHTML = `
    ${decoHTML()}
    <div class="wrap">
      <header class="cat">
        ${logo}
        <h1 class="cat__title">${esc(titulo)}</h1>
        ${cat.subtitulo ? `<p class="cat__subtitle">${esc(cat.subtitulo)}</p>` : ''}
        <div class="cat__rule"></div>
      </header>
      ${cuerpo}
      <footer class="cat">Catálogo en línea</footer>
    </div>
    ${wa}`;
}

async function load() {
  const root = document.getElementById('root');
  // Modo PDF local: los datos vienen por localStorage (no hay token ni link).
  // Se usa desde "Mis pedidos" para descargar el catálogo del pedido en PDF.
  if (new URLSearchParams(location.search).get('pdf') === 'local') {
    try {
      const data = JSON.parse(localStorage.getItem('pinkpower_pdf_catalogo') || 'null');
      if (data && Array.isArray(data.items) && data.items.length) {
        PDF_LOCAL = true;
        render(data);
        // Descarga directa del archivo PDF. Al terminar, pantalla limpia. (Si por
        // algún motivo cae al respaldo de impresión, el evento afterprint también
        // la muestra.)
        window.addEventListener('afterprint', mostrarPdfListo, { once: true });
        descargarPDF(data).then(ok => { if (ok) mostrarPdfListo(); });
        return;
      }
    } catch (_) { /* dato inválido */ }
    root.innerHTML = stateView('😕', 'No se pudo generar el PDF', 'Volvé a intentarlo desde tus pedidos.');
    return;
  }
  const token = getToken();
  if (!token) {
    root.innerHTML = stateView('🔗', 'Enlace incompleto', 'El enlace del catálogo no es válido.');
    return;
  }
  root.innerHTML = skeletonView();
  try {
    const res = await fetch(`${API}/catalogo/${encodeURIComponent(token)}`);
    if (res.status === 404) {
      root.innerHTML = stateView('⏳', 'Catálogo no disponible', 'Este catálogo expiró o ya no está disponible. Pedile uno nuevo a tu vendedora.');
      return;
    }
    if (!res.ok) throw new Error('fetch');
    render(await res.json());
    if (quiereDescargar()) descargarPDF();
  } catch (_) {
    root.innerHTML = stateView('😕', 'No se pudo cargar', 'Revisá tu conexión e intentá de nuevo.');
  }
}

// ── Descargar el catálogo como ARCHIVO PDF (descarga directa) ─────────────
// Se genera el PDF con jsPDF y se baja como archivo, SIN abrir el diálogo de
// impresión (window.print() siempre lo abre; la mayorista quería la descarga
// directa). La librería se carga solo cuando se descarga (no en la vista normal).
// Si algo falla, cae al método viejo (impresión) para no quedar sin nada.
let _jspdfPromise = null;
function cargarJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if (!_jspdfPromise) _jspdfPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = '/vendor/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return _jspdfPromise;
}

function hexRgb(hex) {
  const h = String(hex || '').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const v = parseInt(n || '000000', 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function _cargarImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}

// Baja una imagen y la devuelve como { data (JPEG dataURL), w, h } con la imagen
// COMPLETA, sin recortar (solo reescalada para que no pese de más). Se conserva
// su relación ancho/alto; el recuadro del PDF la ubica "contain" (entera, centrada).
async function imagenData(url, maxPx) {
  const resp = await fetch(url, { mode: 'cors' });
  const blob = await resp.blob();
  const obj = URL.createObjectURL(blob);
  try {
    const img = await _cargarImg(obj);
    const iw = img.naturalWidth || 1, ih = img.naturalHeight || 1;
    const scale = Math.min(1, maxPx / Math.max(iw, ih));
    const cw = Math.max(1, Math.round(iw * scale)), ch = Math.max(1, Math.round(ih * scale));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    return { data: cv.toDataURL('image/jpeg', 0.85), w: cw, h: ch };
  } finally { URL.revokeObjectURL(obj); }
}

function nombrePdf(titulo) {
  const base = String(titulo || 'catalogo').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'catalogo';
  return base + '.pdf';
}

// Construye el PDF (portada + secciones + grilla de 3 columnas) y lo descarga.
async function construirPdf(cat) {
  await cargarJsPDF();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'letter', compress: true });
  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 10, contentW = PW - 2 * M;
  const op = cat.opciones || {};
  const [ar, ag, ab] = hexRgb(op.colorAcento || '#e8437a');
  const [fr, fg, fb] = hexRgb(cat.colorFondo || '#fff0f5');
  const [tr, tg, tb] = hexRgb(cat.colorTexto || '#3a0a1e');
  const items = Array.isArray(cat.items) ? cat.items : [];

  const cols = 3, gap = 5;
  const cardW = (contentW - gap * (cols - 1)) / cols;
  // Recuadro de imagen (más chico para que la foto entera se vea sin recortar y
  // entren más por página). La foto va "contain" dentro; si no es cuadrada quedan
  // márgenes blancos a los lados o arriba/abajo.
  const imgH = cardW * 0.78, bodyH = 14, cardH = imgH + bodyH, rowGap = gap;

  // Precargar las imágenes (completas, sin recortar) en paralelo.
  const imgPx = 640, imgCache = {};
  await Promise.all([...new Set(items.map(i => i.imagen).filter(Boolean))].map(async u => {
    try { imgCache[u] = await imagenData(u, imgPx); } catch (_) {}
  }));

  const pintarFondo = () => { doc.setFillColor(fr, fg, fb); doc.rect(0, 0, PW, PH, 'F'); };
  const nuevaPagina = () => { doc.addPage(); pintarFondo(); return M; };

  pintarFondo();
  let y = M;

  // Portada compacta. El logo se rasteriza (funciona con cualquier formato) y se
  // dibuja respetando su proporción (contain en un cuadro de 16mm), sin estirarlo.
  if (op.logo) {
    let L = null;
    try { L = await imagenData(op.logo, 400); } catch (_) {}
    if (L) {
      const box = 16, s = Math.min(box / L.w, box / L.h);
      const lw = L.w * s, lh = L.h * s;
      try { doc.addImage(L.data, 'JPEG', (PW - lw) / 2, y, lw, lh); } catch (_) {}
      y += lh + 3;
    }
  }
  doc.setTextColor(tr, tg, tb); doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
  const tLines = doc.splitTextToSize(cat.titulo || 'Catálogo', contentW);
  doc.text(tLines, PW / 2, y + 4, { align: 'center' }); y += 4 + tLines.length * 6.5;
  if (cat.subtitulo) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(120, 120, 120);
    const sLines = doc.splitTextToSize(cat.subtitulo, contentW * 0.85);
    doc.text(sLines, PW / 2, y, { align: 'center' }); y += sLines.length * 5;
  }
  doc.setDrawColor(ar, ag, ab); doc.setLineWidth(0.8);
  doc.line(PW / 2 - 12, y + 2, PW / 2 + 12, y + 2); y += 7;

  // Agrupar por colección (orden alfabético; "Otros productos" al final).
  const separar = op.separarPorColeccion !== false && items.some(i => i.coleccion);
  const porNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' });
  const grupos = separar
    ? agrupar(items).map(g => ({ titulo: g.titulo || 'Otros productos', items: g.items.slice().sort(porNombre) }))
    : [{ titulo: '', items: items.slice().sort(porNombre) }];

  const dibujarCard = (it, x, cy) => {
    doc.setFillColor(255, 255, 255); doc.setDrawColor(225, 225, 225); doc.setLineWidth(0.2);
    doc.roundedRect(x, cy, cardW, cardH, 1.6, 1.6, 'FD');
    const im = it.imagen && imgCache[it.imagen];
    if (im) {
      // "contain": la foto entra entera, centrada y sin deformar (respeta ancho/alto).
      const p = 1.5, bw = cardW - p * 2, bh = imgH - p;
      const s = Math.min(bw / im.w, bh / im.h);
      const dw = im.w * s, dh = im.h * s;
      try { doc.addImage(im.data, 'JPEG', x + p + (bw - dw) / 2, cy + p + (bh - dh) / 2, dw, dh); } catch (_) {}
    } else {
      doc.setFillColor(243, 240, 241); doc.rect(x + 1.5, cy + 1.5, cardW - 3, imgH - 1.5, 'F');
    }
    const pad = 2.5;
    let ty = cy + imgH + 4;
    if (it.marca) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6); doc.setTextColor(ar, ag, ab);
      doc.text(doc.splitTextToSize(String(it.marca).toUpperCase(), cardW - pad * 2)[0], x + pad, ty);
      ty += 3;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(40, 40, 40);
    const nLines = doc.splitTextToSize(String(it.nombre || ''), cardW - pad * 2).slice(0, 2);
    doc.text(nLines, x + pad, ty + 2.6); ty += nLines.length * 3;
    if (it.precio) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(ar, ag, ab);
      doc.text(String(it.precio), x + pad, ty + 4.4);
    }
  };

  for (const g of grupos) {
    if (g.titulo) {
      if (y + 8 + cardH > PH - M) y = nuevaPagina();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(ar, ag, ab);
      doc.text(g.titulo, M, y + 4); y += 8;
    }
    for (let i = 0; i < g.items.length; i += cols) {
      if (y + cardH > PH - M) y = nuevaPagina();
      g.items.slice(i, i + cols).forEach((it, c) => dibujarCard(it, M + c * (cardW + gap), y));
      y += cardH + rowGap;
    }
  }

  doc.save(nombrePdf(cat.titulo));
}

async function descargarPDF(cat) {
  const data = cat || _cat;
  try {
    await construirPdf(data);
    return true;               // bajó el archivo directo
  } catch (e) {
    // Respaldo: método viejo (diálogo de impresión) para no quedar sin nada.
    try {
      const imgs = [...document.querySelectorAll('.card__img, .cat__logo')];
      imgs.forEach(im => { try { im.loading = 'eager'; } catch (_) {} });
      await Promise.all(imgs.map(im => (im.complete && im.naturalWidth) ? null
        : new Promise(res => {
            im.addEventListener('load', res, { once: true });
            im.addEventListener('error', res, { once: true });
            setTimeout(res, 4000);
          })));
    } catch (_) {}
    window.print();
    return false;
  }
}

// ¿El link pide descargar (viene con &pdf=1)? Entonces, tras renderizar, imprimimos.
function quiereDescargar() {
  return new URLSearchParams(location.search).get('pdf') === '1';
}

// Pantalla limpia tras descargar el PDF (modo solo-PDF desde Mis pedidos).
function mostrarPdfListo() {
  document.title = 'PDF descargado';
  const root = document.getElementById('root');
  if (root) root.innerHTML = stateView('✅', 'Tu PDF quedó listo', 'Ya lo podés cerrar. Si no lo guardaste, volvé a “Mis pedidos” y generalo de nuevo.');
}

load();

// Abrir el modal del producto al tocar una tarjeta (delegación de eventos).
document.addEventListener('click', e => {
  if (PDF_LOCAL) return;   // en modo solo-PDF los productos no abren nada
  const card = e.target.closest('.card');
  if (card && _cat && card.dataset.i != null) openProductModal(_cat.items[+card.dataset.i]);
});
document.addEventListener('keydown', e => {
  if (PDF_LOCAL) return;
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = document.activeElement;
  if (card && card.classList && card.classList.contains('card') && _cat && card.dataset.i != null) {
    e.preventDefault();
    openProductModal(_cat.items[+card.dataset.i]);
  }
});
</script>
