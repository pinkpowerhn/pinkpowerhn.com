<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Crear catálogo — Mayoreo</title>
<link rel="icon" href="/img/favicon.png" />
<style>
  :root {
    --pp: #e8437a; --pp-dark: #b32c5b; --ink: #2a0f1c;
    --line: rgba(42,15,28,.10); --soft: #fff5f9; --muted: #8a6c79;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf3f6; color: var(--ink); -webkit-font-smoothing: antialiased;
    line-height: 1.45; min-height: 100vh;
  }
  img { display: block; max-width: 100%; }

  /* Cabecera */
  .cb-head {
    display: flex; align-items: center; gap: .8rem;
    padding: .9rem 1rem; background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .cb-head h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }
  .cb-back {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    text-decoration: none; color: var(--ink); font-size: 1.3rem; background: var(--soft);
  }
  .cb-mis { color: var(--pp); font-weight: 700; text-decoration: none; font-size: .92rem; }

  /* Pasos */
  .cb-steps {
    display: flex; gap: .4rem; padding: .9rem 1rem; overflow-x: auto;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .cb-step {
    display: inline-flex; align-items: center; gap: .45rem; white-space: nowrap;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: .45rem .8rem; border-radius: 999px; font-size: .86rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .cb-step:disabled { opacity: .45; cursor: not-allowed; }
  .cb-step.is-active { background: var(--pp); border-color: var(--pp); color: #fff; }
  .cb-step.is-done { color: var(--pp); border-color: var(--pp); }
  .cb-step__n {
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0,0,0,.06); font-size: .76rem;
  }
  .cb-step.is-active .cb-step__n { background: rgba(255,255,255,.25); }

  /* Cuerpo */
  .cb-body { max-width: 920px; margin: 0 auto; padding: 1.1rem 1rem 6rem; }
  .cb-hint { color: var(--muted); font-size: .9rem; margin: .2rem 0 .9rem; }
  .cb-error { color: #c0392b; font-weight: 600; }

  /* Inputs y botones */
  .cb-input {
    width: 100%; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: 10px;
    font-size: .95rem; font-family: inherit; background: #fff; color: var(--ink);
  }
  .cb-input:focus { outline: 2px solid rgba(232,67,122,.35); border-color: var(--pp); }
  .cb-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    padding: .6rem 1rem; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-weight: 700; font-size: .92rem;
    cursor: pointer; font-family: inherit; text-decoration: none;
  }
  .cb-btn:disabled { opacity: .5; cursor: not-allowed; }
  .cb-btn--primary { background: var(--pp); border-color: var(--pp); color: #fff; }
  .cb-btn--ghost { background: var(--soft); }
  .cb-btn--wa { background: #25d366; border-color: #25d366; color: #fff; width: 100%; margin-top: .5rem; }
  .cb-btn--big { width: 100%; padding: .9rem; font-size: 1.05rem; }
  .cb-btn--sm { padding: .4rem .7rem; font-size: .82rem; }

  /* Paso 1: colecciones (chips) */
  .cb-cols { margin-bottom: .8rem; }
  .cb-cols__label { font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
  .cb-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .cb-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: .35rem .7rem; border-radius: 999px; font-size: .82rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .cb-chip:hover { border-color: var(--pp); }
  .cb-chip.is-on { background: var(--pp); border-color: var(--pp); color: #fff; }
  .cb-chip__n { font-size: .72rem; opacity: .7; background: rgba(0,0,0,.06); border-radius: 999px; padding: 0 .4rem; }
  .cb-chip.is-on .cb-chip__n { background: rgba(255,255,255,.25); opacity: .9; }
  .cb-link-btn {
    border: none; background: none; color: var(--pp); font-weight: 700; cursor: pointer;
    font-family: inherit; font-size: .88rem; margin-left: .4rem; padding: 0;
  }

  /* Paso 1: herramientas + grilla */
  .cb-tools { display: grid; grid-template-columns: 1fr; gap: .55rem; margin-bottom: .3rem; }
  @media (min-width: 640px) { .cb-tools { grid-template-columns: 1fr 1fr auto; } }
  .cb-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem;
  }
  @media (min-width: 560px) { .cb-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 800px) { .cb-grid { grid-template-columns: repeat(5, 1fr); } }
  .cb-pcard {
    border: 2px solid transparent; background: #fff; border-radius: 12px; overflow: hidden;
    cursor: pointer; padding: 0; font-family: inherit; text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); position: relative;
  }
  .cb-pcard__img {
    aspect-ratio: 1/1; background: #f3eef1; display: grid; place-items: center;
    font-size: 1.6rem; position: relative; overflow: hidden;
  }
  .cb-pcard__img img { width: 100%; height: 100%; object-fit: cover; }
  .cb-pcard__check {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--pp); color: #fff; display: grid; place-items: center; font-size: .85rem;
    opacity: 0; transform: scale(.5); transition: .15s;
  }
  .cb-pcard.is-on { border-color: var(--pp); }
  .cb-pcard.is-on .cb-pcard__check { opacity: 1; transform: scale(1); }
  .cb-pcard__name {
    display: block; padding: .45rem .55rem .6rem; font-size: .8rem; font-weight: 600;
    line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* Paso 2: precios */
  .cb-plist { display: flex; flex-direction: column; gap: .5rem; }
  .cb-prow {
    display: grid; grid-template-columns: 44px 1fr 110px 32px; align-items: center; gap: .6rem;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .5rem .6rem;
  }
  .cb-prow__img { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background: #f3eef1; display: grid; place-items: center; }
  .cb-prow__img img { width: 100%; height: 100%; object-fit: cover; }
  .cb-prow__name { font-size: .9rem; font-weight: 600; }
  .cb-prow__del { border: none; background: none; color: var(--muted); font-size: 1rem; cursor: pointer; }

  /* Paso 3: diseño + preview */
  .cb-design { display: grid; grid-template-columns: 1fr; gap: 1.4rem; }
  @media (min-width: 920px) { .cb-design { grid-template-columns: minmax(0, 1fr) 460px; align-items: start; } }
  .cb-form { display: flex; flex-direction: column; gap: .9rem; }
  .cb-field { display: flex; flex-direction: column; gap: .35rem; font-size: .86rem; font-weight: 600; }
  .cb-field span { color: var(--muted); }
  .cb-colors { display: flex; gap: 1rem; }
  .cb-field--color input[type=color] { width: 56px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }

  /* Grupos del paso diseño */
  .cb-group { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .85rem; }
  .cb-group__t { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--pp); }

  /* Logo */
  .cb-logo-row { display: flex; align-items: center; gap: 1rem; }
  .cb-logo-prev {
    width: 64px; height: 64px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--soft); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--muted); font-size: .64rem; text-align: center;
  }
  .cb-logo-prev img { width: 100%; height: 100%; object-fit: cover; }
  .cb-logo-actions { display: flex; align-items: center; gap: .8rem; }

  /* Paletas */
  .cb-pals { display: flex; flex-wrap: wrap; gap: .5rem; }
  .cb-pal {
    display: flex; flex-direction: column; align-items: center; gap: .25rem;
    border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: .4rem .5rem .35rem;
    cursor: pointer; font-family: inherit; min-width: 62px;
  }
  .cb-pal.is-on { border-color: var(--pp); }
  .cb-pal__sw { display: inline-block; width: 20px; height: 12px; border-radius: 3px; margin: 0 -3px; border: 1px solid rgba(0,0,0,.08); }
  .cb-pal__sw:first-child { margin-left: 0; }
  .cb-pal__name { font-size: .68rem; font-weight: 700; color: var(--ink); margin-top: .1rem; }

  /* Segmentado (columnas) */
  .cb-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: max-content; }
  .cb-seg__b { border: none; background: #fff; color: var(--ink); padding: .45rem .95rem; font-weight: 700; font-family: inherit; cursor: pointer; border-right: 1px solid var(--line); }
  .cb-seg__b:last-child { border-right: none; }
  .cb-seg__b.is-on { background: var(--pp); color: #fff; }

  /* Switch (separar por colección) */
  .cb-switch { display: flex; align-items: center; gap: .6rem; cursor: pointer; font-size: .92rem; font-weight: 600; }
  .cb-switch input { display: none; }
  .cb-switch__track {
    width: 42px; height: 24px; border-radius: 999px; background: #d9c7d1; position: relative; flex: none; transition: background .18s;
  }
  .cb-switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .cb-switch input:checked + .cb-switch__track { background: var(--pp); }
  .cb-switch input:checked + .cb-switch__track::after { transform: translateX(18px); }

  .cb-preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
  .cb-prev { display: flex; flex-direction: column; align-items: center; gap: .45rem; width: 100%; }
  .cb-prev__label { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  /* Marco de computadora (navegador) — ocupa todo el ancho de la columna */
  .cb-browser { width: 100%; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.16); }
  .cb-browser__bar { height: 28px; background: #ece6ea; display: flex; align-items: center; gap: .35rem; padding: 0 .7rem; flex: none; }
  .cb-browser__bar i { width: 10px; height: 10px; border-radius: 50%; background: #c9bcc5; }
  /* La pantalla es la que scrollea por dentro (no la página). */
  .cb-browser__screen { height: 440px; overflow-y: auto; overflow-x: hidden; background: #fff; overscroll-behavior: contain; }
  /* Marco de celular */
  .cb-phone {
    width: 250px; background: #1c1c1e; border-radius: 30px; padding: 10px; flex: none;
    box-shadow: 0 12px 36px rgba(0,0,0,.22);
  }
  .cb-phone__screen {
    background: #fff; border-radius: 22px; overflow-y: auto; overflow-x: hidden; height: 460px; overscroll-behavior: contain;
  }
  /* Mini-réplica de la página pública */
  .pv { min-height: 100%; font-size: 12px; }
  .pv-head { text-align: center; padding: 1.4rem 1rem .8rem; }
  .pv-logo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; margin: 0 auto .6rem; display: block; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .pv-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
  .pv-sub { margin-top: .3rem; opacity: .8; font-weight: 500; }
  .pv-rule { width: 36px; height: 3px; border-radius: 3px; margin: .7rem auto 0; }
  .pv-sec { font-weight: 800; font-size: .92rem; padding: .8rem .8rem .2rem; display: flex; align-items: center; gap: .4rem; }
  .pv-sec::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
  .pv-grid { display: grid; grid-template-columns: repeat(var(--pvcols, 2), 1fr); gap: .4rem; padding: .6rem; }
  .pv-wa { margin: .2rem .7rem 1rem; text-align: center; background: #25d366; color: #fff; font-weight: 700; font-size: .78rem; padding: .55rem; border-radius: 999px; }
  .pv-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,.1); }
  .pv-card__img { aspect-ratio: 1/1; background: #f3f3f3; display: grid; place-items: center; }
  .pv-card__img img { width: 100%; height: 100%; object-fit: cover; }
  .pv-card__name { font-size: .7rem; font-weight: 600; color: #232323; padding: .35rem .4rem 0; }
  .pv-card__price { font-size: .78rem; font-weight: 800; padding: .15rem .4rem .45rem; }

  /* Paso 4: generar */
  .cb-generar { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .cb-resumen { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem; }
  .cb-resumen h3 { font-size: 1rem; margin-bottom: .5rem; }
  .cb-resumen ul { list-style: none; display: flex; flex-direction: column; gap: .3rem; font-size: .95rem; }
  .cb-ok { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1.4rem; text-align: center; display: flex; flex-direction: column; gap: .7rem; }
  .cb-ok__icon { font-size: 2.4rem; }
  .cb-ok h3 { margin: .2rem 0 0; }
  .cb-ok .cb-hint { margin: 0; }
  .cb-linkbox { display: flex; gap: .5rem; margin: .3rem 0 .2rem; }
  .cb-linkbox .cb-input { font-size: .82rem; }
  /* Botones de acción del resultado: full-width y separados. */
  .cb-ok > .cb-btn { width: 100%; margin: 0; }

  /* Mis catálogos */
  .cb-mis-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .cb-mis-top__t { font-size: 1.15rem; font-weight: 800; }
  .cb-mislist { display: flex; flex-direction: column; gap: .6rem; }
  .cb-btn--danger { background: #e23b53; border-color: #e23b53; color: #fff; }
  .cb-btn--danger:hover { background: #c92f45; border-color: #c92f45; }

  /* Diálogo de confirmación */
  .cb-confirm {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 1.2rem; background: rgba(26,10,18,.5); opacity: 0; transition: opacity .18s ease;
  }
  .cb-confirm.is-open { opacity: 1; }
  .cb-confirm__box {
    background: #fff; border-radius: 16px; padding: 1.5rem 1.4rem 1.3rem; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.3);
    transform: translateY(10px) scale(.97); transition: transform .18s ease;
  }
  .cb-confirm.is-open .cb-confirm__box { transform: translateY(0) scale(1); }
  .cb-confirm__icon { font-size: 2.2rem; }
  .cb-confirm__title { font-size: 1.15rem; font-weight: 800; margin: .4rem 0 .3rem; }
  .cb-confirm__msg { color: var(--muted); font-size: .92rem; line-height: 1.5; }
  .cb-confirm__acts { display: flex; gap: .6rem; margin-top: 1.2rem; }
  .cb-confirm__acts .cb-btn { flex: 1; }
  .cb-miscard {
    display: flex; align-items: center; gap: .8rem; justify-content: space-between;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .7rem .9rem;
  }
  .cb-miscard.is-exp { opacity: .6; }
  .cb-miscard__info { display: flex; flex-direction: column; }
  .cb-miscard__info span { font-size: .82rem; color: var(--muted); }
  .cb-miscard__acts { display: flex; gap: .4rem; }

  /* Footer navegación */
  .cb-foot {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .7rem 1rem; background: #fff; border-top: 1px solid var(--line);
    max-width: 920px; margin: 0 auto;
  }
  .cb-foot__info { color: var(--muted); font-size: .9rem; font-weight: 600; }

  /* Estados */
  .cb-loading, .cb-empty { text-align: center; padding: 3rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: .8rem; }
  .cb-empty__icon { font-size: 2.6rem; }
  .cb-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--pp); border-top-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeletons */
  .sk { position: relative; overflow: hidden; background: rgba(42,15,28,.08); border-radius: 8px; }
  .sk::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .sk-pcard { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .sk-pcard__img { aspect-ratio: 1/1; border-radius: 0; }
  .sk-line { height: 11px; border-radius: 6px; margin: .5rem .55rem; }
  .sk-chip { display: inline-block; width: 120px; height: 30px; border-radius: 999px; margin-right: .4rem; }
  .sk-row { height: 60px; border-radius: 12px; margin-bottom: .6rem; }

  /* Placeholder de producto sin foto (más lindo que un emoji suelto) */
  .cb-noimg {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .25rem; background: linear-gradient(135deg, #fdeef4, #f7e2ec);
    color: #c98aa8;
  }
  .cb-noimg svg { width: 26px; height: 26px; }
  .cb-noimg span { font-size: .62rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

  /* Select bonito (custom) */
  .cb-select { position: relative; }
  .cb-select__btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    padding: .6rem .75rem; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); font-size: .95rem; font-family: inherit;
    font-weight: 600; cursor: pointer; text-align: left;
  }
  .cb-select__btn:focus { outline: 2px solid rgba(232,67,122,.35); border-color: var(--pp); }
  .cb-select__btn .cb-select__cur { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb-select__chev { flex: none; transition: transform .18s ease; color: var(--muted); }
  .cb-select.is-open .cb-select__chev { transform: rotate(180deg); }
  .cb-select__panel {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(150,30,80,.18); padding: .3rem;
    max-height: 260px; overflow-y: auto;
    animation: cbSelIn .14s ease;
  }
  @keyframes cbSelIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .cb-select__opt {
    width: 100%; text-align: left; border: none; background: #fff; color: var(--ink);
    padding: .55rem .7rem; border-radius: 8px; font-size: .92rem; font-family: inherit;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  }
  .cb-select__opt:hover { background: #fff0f6; }
  .cb-select__opt.is-sel { background: #fff0f6; color: var(--pp); }
  .cb-select__opt .cb-select__n { font-size: .76rem; opacity: .6; }
</style>
</head>
<body>
  <div id="cb-root"></div>
  <script type="module" src="/js/catalogo-builder.js"></script>
</body>
</html>
