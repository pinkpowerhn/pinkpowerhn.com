<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recibo · Pink Power</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #e8437a; --pink-dk: #c22a5e; --tinta: #1a0a12; --muted: #8a6f7c;
    --papel: #fff; --fondo: #fdf4f7; --linea: rgba(26,10,18,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font-family: Montserrat, system-ui, sans-serif; font-size: 15px;
    padding: 1.1rem 1rem 2.5rem; display: flex; justify-content: center;
  }
  .hoja {
    width: 100%; max-width: 420px; background: var(--papel); border-radius: 20px;
    box-shadow: 0 10px 30px -18px rgba(26,10,18,0.35); overflow: hidden;
  }
  .cab { text-align: center; padding: 1.5rem 1.2rem 1.1rem; border-bottom: 1px dashed var(--linea); }
  .cab img { height: 42px; width: auto; }
  /* El titulo, grande: es lo primero que se lee y dice que es el papel. */
  .cab p { margin: 0.6rem 0 0; font-size: 1rem; letter-spacing: 0.1em;
           text-transform: uppercase; color: var(--tinta); font-weight: 700; }
  .cuerpo { padding: 1.2rem; }

  .datos { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; margin-bottom: 1.1rem; }
  .dato { flex: 1 1 42%; }
  .dato span { display: block; font-size: 0.6rem; letter-spacing: 0.14em;
               text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .dato b { font-weight: 600; font-size: 0.92rem; }

  .items { border-top: 1px solid var(--linea); }
  .item { display: flex; gap: 0.7rem; padding: 0.7rem 0; border-bottom: 1px solid var(--linea); }
  .item__foto { width: 40px; height: 40px; border-radius: 9px; object-fit: cover;
                flex: 0 0 auto; background: #f8eef3; }
  .item__foto--sin { background: #f8eef3; }
  .item__txt { flex: 1; min-width: 0; }
  .item__nom { font-weight: 600; font-size: 0.9rem; line-height: 1.3; }
  /* La talla o presentación: la dueña la necesita a la vista para despachar. */
  .item__var { font-size: 0.8rem; color: #8a6b79; line-height: 1.3; }
  .item__sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem; }
  .item__imp { font-weight: 700; white-space: nowrap; }

  .suma { margin-top: 0.9rem; }
  .fila { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.9rem; }
  .fila span { color: var(--muted); }
  .fila--total {
    margin-top: 0.5rem; padding-top: 0.7rem; border-top: 1px solid var(--linea);
    align-items: baseline;
  }
  .fila--total span { color: var(--tinta); font-weight: 700; font-size: 0.66rem;
                      letter-spacing: 0.16em; text-transform: uppercase; }
  .fila--total b { font-size: 1.5rem; color: var(--pink-dk); }
  .fila--pend span { color: #9a4b00; font-weight: 700; }
  .fila--pend b { color: #9a4b00; }

  .pie { text-align: center; padding: 1.2rem; border-top: 1px dashed var(--linea);
         color: var(--muted); font-size: 0.76rem; line-height: 1.5; }
  .pie b { display: block; font-family: 'Cormorant Garamond', serif; font-size: 1.25rem;
           color: var(--tinta); font-weight: 600; margin-bottom: 0.25rem; }

  .sello--cot { background: #eef4ff; color: #2f4f92; border-color: #b9cdf0; }
  .sello {
    display: inline-block; margin-top: 0.6rem; background: #fff4d6; color: #8a6d12;
    border: 1px solid #e8cf8a; border-radius: 999px; padding: 0.3rem 0.8rem;
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .redes { display: flex; gap: 0.5rem; margin: 0.9rem 0 1rem; }
  .red {
    flex: 1; display: block; text-decoration: none; border-radius: 12px;
    padding: 0.6rem 0.5rem; font-size: 0.76rem; font-weight: 700;
    color: var(--pink-dk); background: #fff1f6; border: 1px solid rgba(232,67,122,0.16);
  }
  .red--ig {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, #f9ce34, #ee2a7b 55%, #6228d7);
  }
  .red:active { transform: scale(0.98); }

  .aviso { text-align: center; padding: 3rem 1.5rem; color: var(--muted); }
  .aviso b { display: block; color: var(--tinta); font-size: 1.05rem; margin-bottom: 0.4rem; }
  .cargando { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }

  .imprimir {
    display: block; width: 100%; max-width: 420px; margin: 0.9rem auto 0;
    border: none; border-radius: 14px; padding: 0.85rem; cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--pink-dk));
  }
  /* El ticket es cosa de la tienda, no de la clienta: va discreto, debajo. */
  .ticket {
    display: block; margin: 0.6rem auto 0; background: none; border: none;
    cursor: pointer; font-family: inherit; font-size: 0.74rem; font-weight: 600;
    color: var(--muted); text-decoration: underline; padding: 0.4rem;
  }
  .ticket[disabled] { opacity: 0.6; text-decoration: none; }

  /* Al imprimir queda solo el papel: sin fondo, sin sombras, sin botón. */
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .hoja { max-width: none; box-shadow: none; border-radius: 0; }
    .imprimir, .ticket { display: none; }
    /* En papel, los botones se vuelven texto: tocarlos no se puede. */
    .redes { display: block; }
    .red { background: none; border: none; color: #000; padding: 0.1rem;
           display: inline; font-size: 0.7rem; }
    .red--ig::after { content: ' @pinkpowerhn'; }
  }
</style>
</head>
<body>
<div style="width:100%; max-width:420px">
  <div class="hoja" id="hoja">
    <div class="cargando">Abriendo el recibo…</div>
  </div>
  <button class="imprimir" id="imprimir" hidden type="button">Imprimir o guardar en PDF</button>
  <button class="ticket" id="ticket" hidden type="button">Imprimir en la impresora de tickets</button>
</div>

<script>
const API = 'https://api.pinkpowerhn.com';
const L = (n) => 'L. ' + (Number(n) || 0).toLocaleString('es-HN', {
  minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (t) => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const PAGOS = { efectivo: 'Efectivo', tarjeta: 'Tarjeta',
                transferencia: 'Transferencia', credito: 'Crédito' };

function fecha(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('es-HN', { day: '2-digit', month: 'long', year: 'numeric' })
    + ' · ' + d.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });
}

// De las ventas viejas no se guardaba la forma de pago, asi que ahi se dice al
// menos si quedo pagada: un "· pendiente" suelto no significaba nada.
function textoDePago(r) {
  const forma = PAGOS[r.pago] || r.pago || '';
  const banco = r.banco ? ' · ' + r.banco : '';
  if (!forma) return r.pagado === false ? 'Pendiente' : 'Pagado';
  return forma + banco + (r.pagado === false ? ' · pendiente' : '');
}

function pintar(r) {
  recibo = r;
  const items = (r.items || []).map((i) => `
    <div class="item">
      ${i.imagen ? `<img class="item__foto" src="${esc(i.imagen)}" alt="" loading="lazy" />`
                 : '<div class="item__foto item__foto--sin"></div>'}
      <div class="item__txt">
        <div class="item__nom">${esc(i.nombre)}</div>
        ${i.variante ? `<div class="item__var">${esc(i.variante)}</div>` : ''}
        <div class="item__sub">${i.cantidad} × ${L(i.precio)}</div>
      </div>
      <div class="item__imp">${L(i.importe)}</div>
    </div>`).join('');

  const d = r.descuento;
  document.getElementById('hoja').innerHTML = `
    <div class="cab">
      <img src="/img/logo.png" alt="Pink Power" />
      <p>${r.cotizacion ? 'Cotización' : 'Recibo'}${
        r.numero && r.numero !== '(prueba)' ? ' ' + esc(r.numero) : ''}</p>
      ${r.ensayo ? '<div class="sello">Prueba · sin valor</div>' : ''}
    </div>
    <div class="cuerpo">
      <div class="datos">
        <div class="dato"><span>Fecha</span><b>${esc(fecha(r.fecha))}</b></div>
        ${r.cliente ? `<div class="dato"><span>Clienta</span><b>${esc(r.cliente)}</b></div>` : ''}
        ${r.cotizacion ? '' : `<div class="dato"><span>Pago</span><b>${esc(textoDePago(r))}</b></div>`}
      </div>
      <div class="items">${items}</div>
      <div class="suma">
        ${(d && d.monto > 0) || (r.flete && r.flete.monto > 0)
          ? `<div class="fila"><span>Subtotal</span><b>${L(r.subtotal)}</b></div>` : ''}
        ${d && d.monto > 0 ? `<div class="fila"><span>Descuento${
          d.tipo === 'porcentaje' ? ' (' + d.valor + '%)' : ''}</span><b>− ${L(d.monto)}</b></div>` : ''}
        ${r.flete && r.flete.monto > 0
          ? `<div class="fila"><span>${esc(r.flete.titulo)}</span><b>${L(r.flete.monto)}</b></div>` : ''}
        <div class="fila fila--total"><span>Total</span><b>${L(r.total)}</b></div>
        ${r.recibido ? `<div class="fila"><span>Recibido</span><b>${L(r.recibido)}</b></div>` : ''}
        ${r.cambio ? `<div class="fila"><span>Cambio</span><b>${L(r.cambio)}</b></div>` : ''}
        <!-- Pedido corregido despues de cobrar: queda un saldo y hay que decirlo. -->
        ${r.pendiente > 0 ? `
          <div class="fila"><span>Abonado</span><b>${L(Math.max(0, (Number(r.total) || 0) - Number(r.pendiente)))}</b></div>
          <div class="fila fila--pend"><span>Pendiente</span><b>${L(r.pendiente)}</b></div>` : ''}
      </div>
    </div>
    <div class="pie">
      <b>${r.cotizacion ? '¡Gracias por su interés!' : '¡Gracias por su compra!'}</b>
      <div class="redes">
        <a class="red red--ig" href="https://instagram.com/pinkpowerhn"
           target="_blank" rel="noopener">Síguenos en Instagram</a>
        <a class="red" href="https://pinkpowerhn.com" target="_blank" rel="noopener">
          Compra en línea</a>
      </div>
      Pink Power · Honduras<br />
      ${r.cotizacion
        ? 'Cotización sujeta a disponibilidad. No es un comprobante de compra.'
        : 'Este comprobante no sustituye una factura fiscal.'}
    </div>`;
  document.getElementById('imprimir').hidden = false;
  document.getElementById('ticket').hidden = false;
  document.title = (r.cotizacion ? 'Cotización ' : 'Recibo ')
    + (r.ensayo ? '' : (r.numero || '')) + ' · Pink Power';
}

function sinRecibo(texto) {
  document.getElementById('hoja').innerHTML =
    `<div class="aviso"><b>No encontramos este recibo</b>${esc(texto)}</div>`;
}

// ── El ticket de la impresora térmica ────────────────────────────────────────
// La impresora de la tienda es de 58 mm: imprime 384 puntos de ancho y nada
// más. Mandarle el PDF de esta hoja no sirve —la app lo encoge de tamaño carta
// a 5 cm y la letra desaparece—, así que aquí se vuelve a dibujar el mismo
// recibo a 384 px, en blanco y negro puro y sin fotos, y se le entrega como
// imagen: las apps de impresión térmica imprimen la imagen punto por punto.
const TICKET = 384;
const MT = 12;                  // el margen, a cada lado
let recibo = null;              // lo último que se pintó, para armar el ticket

function cargarImagen(src) {
  return new Promise((ok) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => ok(null);
    setTimeout(() => ok(null), 6000);
    im.src = src;
  });
}

// El papel térmico no tiene grises: lo que no es blanco se imprime negro. El
// logo rosado saldría como una mancha sucia, así que se le pasa un umbral.
function aNegro(c, y, alto) {
  const img = c.getImageData(0, y, TICKET, alto);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const claro = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11 > 200;
    d[i] = d[i + 1] = d[i + 2] = claro ? 255 : 0;
    d[i + 3] = 255;
  }
  c.putImageData(img, 0, y);
}

function tPartir(c, texto, ancho) {
  const palabras = String(texto == null ? '' : texto).split(/\s+/).filter(Boolean);
  const lineas = [];
  let act = '';
  for (let p of palabras) {
    // Una palabra sola más ancha que el papel (un nombre larguísimo) se corta.
    while (c.measureText(p).width > ancho) {
      let n = 1;
      while (n < p.length && c.measureText(p.slice(0, n + 1)).width <= ancho) n++;
      if (act) { lineas.push(act); act = ''; }
      lineas.push(p.slice(0, n));
      p = p.slice(n);
    }
    const prueba = act ? act + ' ' + p : p;
    if (!act || c.measureText(prueba).width <= ancho) act = prueba;
    else { lineas.push(act); act = p; }
  }
  if (act) lineas.push(act);
  return lineas.length ? lineas : [''];
}

async function dibujarTicket(r) {
  const lienzo = document.createElement('canvas');
  lienzo.width = TICKET; lienzo.height = 4000;
  const c = lienzo.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, TICKET, 4000);
  c.fillStyle = '#000'; c.textBaseline = 'top';

  const F = (px, peso) => { c.font = `${peso || 500} ${px}px Montserrat, sans-serif`; };
  const util = TICKET - MT * 2;
  const der = TICKET - MT;
  let y = 8;

  const centro = (texto, px, peso, salto) => {
    F(px, peso); c.textAlign = 'center';
    for (const ln of tPartir(c, texto, util)) { c.fillText(ln, TICKET / 2, y); y += salto; }
  };
  const izq = (texto, px, peso, salto, sangria) => {
    F(px, peso); c.textAlign = 'left';
    for (const ln of tPartir(c, texto, util - (sangria || 0))) {
      c.fillText(ln, MT + (sangria || 0), y); y += salto;
    }
  };
  const fila = (etq, val, px, peso, salto) => {
    F(px, peso); c.textAlign = 'left'; c.fillText(etq, MT, y);
    c.textAlign = 'right'; c.fillText(val, der, y);
    y += salto;
  };
  const raya = () => {
    c.fillStyle = '#000';
    for (let x = MT; x < der; x += 6) c.fillRect(x, y, 3, 1);
    y += 9;
  };

  const logo = await cargarImagen('/img/logo.png');
  if (logo && logo.width) {
    const w = 168, h = Math.round(logo.height * (w / logo.width));
    c.drawImage(logo, Math.round((TICKET - w) / 2), y, w, h);
    aNegro(c, y, h);
    y += h + 12;
  }

  const numero = r.numero && r.numero !== '(prueba)' ? ' ' + r.numero : '';
  centro((r.cotizacion ? 'COTIZACIÓN' : 'RECIBO') + numero, 23, 700, 30);
  if (r.ensayo) centro('PRUEBA · SIN VALOR', 16, 700, 22);
  y += 2;

  izq('Fecha: ' + fecha(r.fecha), 16, 500, 21);
  if (r.cliente) izq('Clienta: ' + r.cliente, 16, 500, 21);
  if (!r.cotizacion) izq('Pago: ' + textoDePago(r), 16, 500, 21);

  y += 6; raya(); y += 4;
  for (const it of (r.items || [])) {
    izq(it.nombre, 18, 700, 22);
    if (it.variante) izq(it.variante, 16, 500, 20, 10);
    F(17, 500); c.textAlign = 'left';
    c.fillText(`${it.cantidad} × ${L(it.precio)}`, MT + 10, y);
    F(18, 700); c.textAlign = 'right';
    c.fillText(L(it.importe), der, y);
    y += 27;
  }
  raya(); y += 4;

  const d = r.descuento;
  const conFlete = r.flete && r.flete.monto > 0;
  if ((d && d.monto > 0) || conFlete) fila('Subtotal', L(r.subtotal), 17, 500, 23);
  if (d && d.monto > 0) {
    fila('Descuento' + (d.tipo === 'porcentaje' ? ` (${d.valor}%)` : ''),
         '- ' + L(d.monto), 17, 500, 23);
  }
  if (conFlete) fila(r.flete.titulo, L(r.flete.monto), 17, 500, 23);
  y += 2;
  fila('TOTAL', L(r.total), 23, 700, 32);
  if (r.recibido) fila('Recibido', L(r.recibido), 17, 500, 23);
  if (r.cambio) fila('Cambio', L(r.cambio), 17, 500, 23);
  if (r.pendiente > 0) {
    fila('Abonado', L(Math.max(0, (Number(r.total) || 0) - Number(r.pendiente))), 17, 500, 23);
    fila('PENDIENTE', L(r.pendiente), 19, 700, 27);
  }

  y += 6; raya(); y += 8;
  centro(r.cotizacion ? '¡Gracias por su interés!' : '¡Gracias por su compra!', 18, 700, 25);
  centro('@pinkpowerhn · pinkpowerhn.com', 16, 500, 21);
  centro('Pink Power · Honduras', 16, 500, 21);
  centro(r.cotizacion
    ? 'Cotización sujeta a disponibilidad. No es un comprobante de compra.'
    : 'Este comprobante no sustituye una factura fiscal.', 14, 500, 18);
  y += 30;                      // papel de sobra, para cortar sin comerse el pie

  // Recortado al alto que se usó: si se manda el lienzo entero, la impresora
  // escupe los cuatro metros de blanco que sobran.
  const alto = Math.min(4000, Math.ceil(y));
  const final = document.createElement('canvas');
  final.width = TICKET; final.height = alto;
  const f = final.getContext('2d');
  f.fillStyle = '#fff'; f.fillRect(0, 0, TICKET, alto);
  f.drawImage(lienzo, 0, 0);
  return final;
}

async function mandarTicket() {
  const b = document.getElementById('ticket');
  if (!recibo || !b || b.disabled) return;
  const antes = b.textContent;
  b.disabled = true; b.textContent = 'Armando el ticket…';
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const lienzo = await dibujarTicket(recibo);
    const blob = await new Promise((ok) => lienzo.toBlob(ok, 'image/png'));
    const nombre = `Ticket ${(recibo.numero || '').replace(/[^\w#-]/g, '')} Pink Power.png`
      .replace(/\s+/g, ' ');
    const archivo = new File([blob], nombre, { type: 'image/png' });
    // En el teléfono se pasa por el menú de compartir, que es por donde se le
    // entrega a la app de la impresora. En una computadora, se baja y ya.
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [archivo] })) {
      await navigator.share({ files: [archivo] });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
  } catch (ex) {
    // Cerrar el menú de compartir no es una falla: solo se avisa de lo demás.
    if (!ex || ex.name !== 'AbortError') b.textContent = 'No se pudo armar el ticket';
  }
  b.disabled = false;
  if (b.textContent !== 'No se pudo armar el ticket') b.textContent = antes;
  else setTimeout(() => { b.textContent = antes; }, 3000);
}

(async () => {
  // El token puede venir como ?t= o al final de la ruta, para que el enlace se
  // pueda acortar sin romper nada.
  const p = new URLSearchParams(location.search);
  const token = (p.get('t') || location.hash.replace('#', '') || '').trim();
  if (!token) { sinRecibo('El enlace está incompleto.'); return; }
  try {
    const res = await fetch(`${API}/recibo/${encodeURIComponent(token)}`);
    if (!res.ok) {
      sinRecibo(res.status === 404
        ? 'El enlace no es válido o el recibo ya no está disponible.'
        : 'Intentá de nuevo en un momento.');
      return;
    }
    pintar(await res.json());
  } catch (_) {
    sinRecibo('Revisá la conexión e intentá de nuevo.');
  }
})();

document.getElementById('imprimir').addEventListener('click', () => window.print());
document.getElementById('ticket').addEventListener('click', mandarTicket);
</script>
</body>
</html>
